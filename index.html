<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Global safeguard against Pannellum async FileReader cleanup race conditions
      (function() {
        if (typeof window !== 'undefined' && window.FileReader) {
          var origAddEvt = FileReader.prototype.addEventListener;
          FileReader.prototype.addEventListener = function(type, listener, options) {
            if (typeof listener === 'function') {
              var safeListener = function() {
                try {
                  return listener.apply(this, arguments);
                } catch (err) {
                  if (err && err.message && (err.message.indexOf("setting 'src'") !== -1 || err.message.indexOf("Cannot set properties of undefined") !== -1)) {
                    console.warn('[Pannellum] Ignorando corrida assíncrona de limpeza do FileReader com sucesso.');
                    return;
                  }
                  throw err;
                }
              };
              return origAddEvt.call(this, type, safeListener, options);
            }
            return origAddEvt.call(this, type, listener, options);
          };
        }
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf("setting 'src'") !== -1 || e.message.indexOf("Cannot set properties of undefined") !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
