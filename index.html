<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <script>
      // Global safeguard against translation tools / extensions modifying DOM out from under React
      (function() {
        if (typeof window !== 'undefined') {
          if (typeof Node !== 'undefined' && Node.prototype) {
            var origRemoveChild = Node.prototype.removeChild;
            Node.prototype.removeChild = function(child) {
              if (child && child.parentNode !== this) {
                if (console && console.warn) {
                  console.warn('[DOM Safeguard] Ignorando removeChild de nó com parent divergente.', child);
                }
                return child;
              }
              return origRemoveChild.call(this, child);
            };

            var origInsertBefore = Node.prototype.insertBefore;
            Node.prototype.insertBefore = function(newNode, referenceNode) {
              if (referenceNode && referenceNode.parentNode !== this) {
                if (console && console.warn) {
                  console.warn('[DOM Safeguard] Ignorando insertBefore de nó com parent divergente.', referenceNode);
                }
                return newNode;
              }
              return origInsertBefore.call(this, newNode, referenceNode);
            };
          }

          // Safeguard against Pannellum async FileReader cleanup race conditions
          if (window.FileReader) {
            var origAddEvt = FileReader.prototype.addEventListener;
            FileReader.prototype.addEventListener = function(type, listener, options) {
              if (typeof listener === 'function') {
                var safeListener = function() {
                  try {
                    return listener.apply(this, arguments);
                  } catch (err) {
                    if (err && err.message && (err.message.indexOf("setting 'src'") !== -1 || err.message.indexOf("Cannot set properties of undefined") !== -1)) {
                      console.warn('[Pannellum] Ignorando corrida assíncrona de limpeza do FileReader com sucesso.');
                      return;
                    }
                    throw err;
                  }
                };
                return origAddEvt.call(this, type, safeListener, options);
              }
              return origAddEvt.call(this, type, listener, options);
            };
          }

          window.addEventListener('error', function(e) {
            if (e && e.message && (
              e.message.indexOf("setting 'src'") !== -1 ||
              e.message.indexOf("Cannot set properties of undefined") !== -1 ||
              e.message.indexOf("The node to be removed is not a child of this node") !== -1
            )) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          }, true);
        }
      })();
    </script>
    <title>EAD 360 Studio</title>
    <meta name="description" content="Crie experiências educacionais interativas em 360º para EAD com hotspots informativos e exportação HTML 100% offline." />
    <meta property="og:title" content="EAD 360 Studio" />
    <meta property="og:description" content="Crie experiências educacionais interativas em 360º para EAD com hotspots informativos e exportação HTML 100% offline." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
